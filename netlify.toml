[build]
  command = "cd backend/functions && npm install && cd ../../frontend && npm install && npm run build"
  publish = "frontend/dist"

[build.environment]
  SECRETS_SCAN_ENABLED = false
  
[functions]
  directory = "backend/functions"
  node_bundler = "esbuild"
  external_node_modules = ["express", "cors", "dotenv", "serverless-http", "@supabase/supabase-js", "multer", "body-parser"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Crucial for Vue Router - SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200